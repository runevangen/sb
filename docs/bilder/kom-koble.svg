<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" width="1000" height="500"
     font-family="Liberation Sans, DejaVu Sans, Helvetica, Arial, sans-serif">
  <style>
    .ramme { fill:#ffffff; stroke:#c9d0e6; stroke-width:2; rx:10 }
    .topp  { fill:#eef1f8; stroke:#c9d0e6; stroke-width:2 }
    .tit   { font-size:19px; font-weight:bold; fill:#14245c }
    .txt   { font-size:16px; fill:#1b1f2a }
    .lit   { font-size:14px; fill:#5a6074 }
    .mono  { font-family:"DejaVu Sans Mono", monospace; font-size:14px; fill:#1b1f2a }
    .knapp { fill:#1f4fd6; rx:8 }
    .knt   { font-size:16px; font-weight:bold; fill:#ffffff }
    .num   { fill:#14245c }
    .numt  { font-size:18px; font-weight:bold; fill:#ffffff }
    .valgt { fill:#e4ecff; stroke:#1f4fd6; stroke-width:2; rx:6 }
  </style>

  <text class="tit" x="20" y="28">Tre klikk, én gang. Ingen kommandoer.</text>

  <circle class="num" cx="36" cy="88" r="17"/><text class="numt" x="36" y="95" text-anchor="middle">1</text>
  <text class="txt" x="66" y="82">Gå til claude.ai/code</text>
  <text class="lit" x="66" y="104">og logg inn med din egen Claude-konto.</text>

  <circle class="num" cx="36" cy="178" r="17"/><text class="numt" x="36" y="185" text-anchor="middle">2</text>
  <text class="txt" x="66" y="172">Trykk «Connect GitHub»</text>
  <text class="lit" x="66" y="194">og godkjenn hos GitHub. Du logger inn som</text>
  <text class="lit" x="66" y="214">deg selv — ingen deler passord med noen.</text>

  <circle class="num" cx="36" cy="288" r="17"/><text class="numt" x="36" y="295" text-anchor="middle">3</text>
  <text class="txt" x="66" y="282">Velg repoet runevangen/sb</text>
  <text class="lit" x="66" y="304">i lista. Du står oppført som collaborator,</text>
  <text class="lit" x="66" y="324">så det skal dukke opp av seg selv.</text>

  <text class="lit" x="66" y="392">Dukker det ikke opp: si fra til Rune. Da er det</text>
  <text class="lit" x="66" y="412">GitHub-appen som mangler tilgang, ikke deg.</text>

  <rect class="ramme" x="500" y="52" width="482" height="404"/>
  <path class="topp" d="M500 62 a10 10 0 0 1 10 -10 h462 a10 10 0 0 1 10 10 v34 h-482 z"/>
  <circle cx="524" cy="79" r="6" fill="#d5dae8"/>
  <circle cx="546" cy="79" r="6" fill="#d5dae8"/>
  <circle cx="568" cy="79" r="6" fill="#d5dae8"/>
  <rect x="592" y="68" width="366" height="22" rx="11" fill="#ffffff" stroke="#d5dae8"/>
  <text class="mono" x="604" y="84">claude.ai/code</text>

  <text class="tit" x="524" y="134">Claude Code</text>
  <rect class="knapp" x="524" y="152" width="196" height="38"/>
  <text class="knt" x="622" y="177" text-anchor="middle">Connect GitHub</text>
  <text class="lit" x="736" y="177">← steg 2</text>

  <text class="txt" x="524" y="232">Velg repository</text>
  <rect class="valgt" x="524" y="246" width="320" height="38"/>
  <text class="mono" x="540" y="270">runevangen/sb</text>
  <text class="lit" x="860" y="270">← steg 3</text>
  <rect x="524" y="292" width="320" height="34" rx="6" fill="#f7f8fc" stroke="#e4e7f0"/>
  <text class="mono" x="540" y="314" fill="#9aa0b4">et annet repo …</text>
  <rect x="524" y="334" width="320" height="34" rx="6" fill="#f7f8fc" stroke="#e4e7f0"/>
  <text class="mono" x="540" y="356" fill="#9aa0b4">et annet repo …</text>

  <text class="lit" x="524" y="404">Etterpå er det bare chat. Du skriver hva du vil ha gjort,</text>
  <text class="lit" x="524" y="426">på norsk, og leser svaret.</text>
</svg>
