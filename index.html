<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sportsbibelen</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: #0B1210;
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    display: flex;
    justify-content: center;
    padding: 24px 12px;
    min-height: 100vh;
  }

  .phone {
    width: 390px;
    max-width: 100%;
    background: #0F1A16;
    border-radius: 28px;
    border: 1px solid #223029;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    height: 780px;
  }

  .header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 18px 18px 14px;
    border-bottom: 1px solid #1B2621;
    flex-shrink: 0;
  }

  .logo {
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 700;
    font-size: 22px;
    color: #EAF0ED;
    letter-spacing: 0.3px;
    margin: 0;
  }

  .live-tag {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    color: #FF8A3D;
    font-weight: 500;
  }

  .dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: #FF8A3D;
  }

  .feed {
    overflow-y: auto;
    flex: 1;
    padding: 14px 14px 24px;
  }

  .state {
    color: #86998F;
    font-size: 14px;
    text-align: center;
    padding: 60px 20px;
  }

  .hero {
    position: relative;
    border-radius: 16px;
    overflow: hidden;
    margin-bottom: 18px;
    cursor: pointer;
    background: #16211C;
    height: 220px;
  }

  .hero img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  .hero-overlay {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    padding: 16px;
    background: linear-gradient(transparent, rgba(6,10,8,0.92));
  }

  .cat-pill {
    display: inline-block;
    font-size: 11.5px;
    color: #0B1F17;
    background: #34D399;
    padding: 3px 9px;
    border-radius: 5px;
    font-weight: 600;
    margin-bottom: 8px;
  }

  .hero-title {
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 600;
    font-size: 21px;
    line-height: 1.2;
    color: #F5F8F6;
    margin: 0;
  }

  .meta {
    font-size: 12px;
    color: #9FB3A9;
    margin-top: 6px;
  }

  .row {
    display: flex;
    gap: 12px;
    padding: 12px 0;
    border-bottom: 1px solid #1B2621;
    cursor: pointer;
  }

  .row img, .row .thumb-empty {
    width: 76px;
    height: 76px;
    border-radius: 10px;
    object-fit: cover;
    flex-shrink: 0;
    background: #16211C;
  }

  .row-body {
    display: flex;
    flex-direction: column;
    justify-content: center;
    min-width: 0;
  }

  .row-cat {
    font-size: 11px;
    color: #34D399;
    font-weight: 600;
    margin-bottom: 4px;
  }

  .row-title {
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 600;
    font-size: 15.5px;
    line-height: 1.25;
    color: #EAF0ED;
    margin: 0;
    display: -webkit-box;
    -webkit-line-clamp: 3;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }

  .row-meta {
    font-size: 11.5px;
    color: #86998F;
    margin-top: 6px;
  }

  .detail-wrap {
    position: fixed;
    inset: 0;
    background: rgba(4,8,6,0.7);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 10;
  }

  .detail-wrap.open {
    display: flex;
  }

  .detail-card {
    width: 390px;
    max-width: 92%;
    max-height: 80%;
    overflow-y: auto;
    background: #0F1A16;
    border-radius: 18px;
    border: 1px solid #223029;
    padding: 0 0 20px;
  }

  .detail-card img {
    width: 100%;
    height: 180px;
    object-fit: cover;
    display: block;
  }

  .detail-body {
    padding: 16px 18px 0;
  }

  .detail-title {
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 600;
    font-size: 20px;
    line-height: 1.25;
    color: #F5F8F6;
    margin: 0 0 8px;
  }

  .detail-excerpt {
    font-size: 14px;
    line-height: 1.6;
    color: #C4D2CB;
  }

  .close-btn {
    display: block;
    margin: 16px auto 0;
    background: none;
    border: 1px solid #2C3E36;
    color: #9FB3A9;
    border-radius: 8px;
    padding: 8px 16px;
    font-size: 13px;
    cursor: pointer;
  }
</style>
</head>
<body>

  <div class="phone">
    <div class="header">
      <p class="logo">Sportsbibelen</p>
      <div class="live-tag"><span class="dot"></span>LIVE</div>
    </div>
    <div class="feed" id="feed">
      <p class="state">Henter nyheter …</p>
    </div>
  </div>

  <div class="detail-wrap" id="detailWrap">
    <div class="detail-card" id="detailCard"></div>
  </div>

<script>
  // Bytt WP_URL til din egen WordPress-side når som helst.
  const WP_URL = "https://sportsbibelen.no/wp-json/wp/v2/posts?_embed&per_page=12";

  // Midlertidig CORS-proxy. WordPress-servere sender som regel ikke
  // CORS-headere som tillater fetch fra et annet domene (som Netlify),
  // så dette mellomleddet er nødvendig med mindre serveren din
  // eksplisitt tillater det (se merknad nederst i filen).
  const API_URL = "https://api.allorigins.win/raw?url=" + encodeURIComponent(WP_URL);

  function decodeEntities(str) {
    const txt = document.createElement("textarea");
    txt.innerHTML = str;
    return txt.value;
  }

  function stripHtml(html) {
    const div = document.createElement("div");
    div.innerHTML = html;
    return decodeEntities(div.textContent || div.innerText || "");
  }

  function timeAgo(dateStr) {
    const diffMs = Date.now() - new Date(dateStr).getTime();
    const mins = Math.floor(diffMs / 60000);
    if (mins < 1) return "nå nettopp";
    if (mins < 60) return mins + " min siden";
    const hours = Math.floor(mins / 60);
    if (hours < 24) return hours + "t siden";
    const days = Math.floor(hours / 24);
    return days + "d siden";
  }

  function getImage(post) {
    const media = post._embedded && post._embedded["wp:featuredmedia"] && post._embedded["wp:featuredmedia"][0];
    return (media && media.source_url) || null;
  }

  function getCategory(post) {
    const terms = post._embedded && post._embedded["wp:term"] && post._embedded["wp:term"][0];
    return terms && terms.length > 0 ? terms[0].name : null;
  }

  function renderFeed(posts) {
    const feed = document.getElementById("feed");
    feed.innerHTML = "";

    if (!posts.length) {
      feed.innerHTML = '<p class="state">Ingen artikler funnet.</p>';
      return;
    }

    const hero = posts[0];
    const heroImg = getImage(hero);
    const heroCat = getCategory(hero);

    const heroEl = document.createElement("div");
    heroEl.className = "hero";
    heroEl.innerHTML =
      (heroImg ? '<img src="' + heroImg + '" alt="">' : "") +
      '<div class="hero-overlay">' +
      (heroCat ? '<span class="cat-pill">' + heroCat + "</span>" : "") +
      '<h2 class="hero-title">' + stripHtml(hero.title.rendered) + "</h2>" +
      '<p class="meta">' + timeAgo(hero.date) + "</p>" +
      "</div>";
    heroEl.addEventListener("click", () => openDetail(hero));
    feed.appendChild(heroEl);

    posts.slice(1).forEach((post) => {
      const img = getImage(post);
      const cat = getCategory(post);
      const row = document.createElement("div");
      row.className = "row";
      row.innerHTML =
        (img ? '<img src="' + img + '" alt="">' : '<div class="thumb-empty"></div>') +
        '<div class="row-body">' +
        (cat ? '<span class="row-cat">' + cat + "</span>" : "") +
        '<h3 class="row-title">' + stripHtml(post.title.rendered) + "</h3>" +
        '<p class="row-meta">' + timeAgo(post.date) + "</p>" +
        "</div>";
      row.addEventListener("click", () => openDetail(post));
      feed.appendChild(row);
    });
  }

  function openDetail(post) {
    const img = getImage(post);
    const cat = getCategory(post);
    const card = document.getElementById("detailCard");
    card.innerHTML =
      (img ? '<img src="' + img + '" alt="">' : "") +
      '<div class="detail-body">' +
      (cat ? '<span class="row-cat">' + cat + "</span>" : "") +
      '<h2 class="detail-title">' + stripHtml(post.title.rendered) + "</h2>" +
      '<p class="detail-excerpt">' + stripHtml(post.excerpt.rendered) + "</p>" +
      '<button class="close-btn" id="closeBtn">Lukk</button>' +
      "</div>";
    document.getElementById("detailWrap").classList.add("open");
    document.getElementById("closeBtn").addEventListener("click", closeDetail);
  }

  function closeDetail() {
    document.getElementById("detailWrap").classList.remove("open");
  }

  document.getElementById("detailWrap").addEventListener("click", (e) => {
    if (e.target.id === "detailWrap") closeDetail();
  });

  fetch(API_URL)
    .then((res) => {
      if (!res.ok) throw new Error("Nettverksfeil");
      return res.json();
    })
    .then(renderFeed)
    .catch(() => {
      document.getElementById("feed").innerHTML =
        '<p class="state">Klarte ikke å hente nyheter akkurat nå.</p>';
    });
</script>
</body>
</html>
