<!DOCTYPE html>
<html lang="nb">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Sportsbibelen</title>
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#243B98">
<link rel="apple-touch-icon" href="/icons/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Sportsbibelen">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<!--
  Cookielos statistikk. Plausible setter ingen informasjonskapsler og lagrer
  ingen personopplysninger, sa appen trenger ingen samtykkebanner.

  For dette samler noe som helst ma domenet mvp-sb.netlify.app legges til i
  en Plausible-konto. Inntil da er skriptet en stille no-op.
  Skru av statistikk helt: slett denne script-taggen. Koden under tar hoyde
  for at den mangler.
-->
<script defer data-domain="mvp-sb.netlify.app" src="https://plausible.io/js/script.js"></script>
<script>
  // Kjores for rendering. Uten dette rekker standardtemaet a vises et
  // oyeblikk for valget leses inn.
  try {
    var lagret = JSON.parse(localStorage.getItem("sb-visning")) || {};
    if (lagret.svart) document.documentElement.setAttribute("data-theme", "svart");
    if (lagret.stor)  document.documentElement.setAttribute("data-font", "stor");
  } catch (e) { /* privat modus: standardvisning */ }
</script>
<link rel="stylesheet" href="/app.css">

</head>
<body>

  <div class="phone">
    <div class="header">
      <div class="head-left">
        <button class="menu-btn" id="menuBtn" type="button"
                aria-label="Åpne meny" aria-expanded="false" aria-controls="menuPanel">
          <span class="bars" aria-hidden="true"></span>
        </button>
        <h1 class="logo"><img src="/logo-mark.png" alt="Sportsbibelen"></h1>
        <span class="filter-tag" id="filterTag"></span>
      </div>
    </div>

    <nav class="menu-panel" id="menuPanel" aria-label="Hovedmeny">
      <div class="menu-head">
        <p class="menu-title">Meny</p>
        <div class="menu-tools">
          <div class="segment" role="group" aria-label="Fargetema">
            <button class="segment-del" id="temaLys" type="button">Lyst</button>
            <button class="segment-del" id="temaSvart" type="button">Mørkt</button>
          </div>
          <div class="segment" role="group" aria-label="Skriftstørrelse">
            <button class="segment-del" id="skriftNormal" type="button" aria-label="Normal skrift">A</button>
            <button class="segment-del segment-stor" id="skriftStor" type="button" aria-label="Større skrift">A+</button>
          </div>
          <button class="menu-close" id="menuClose" type="button" aria-label="Lukk meny">&times;</button>
        </div>
      </div>
      <form class="sok" id="sokForm" role="search">
        <input class="sok-felt" id="sokFelt" type="search" name="q"
               placeholder="Søk i alle saker" aria-label="Søk i alle saker"
               autocomplete="off">
        <button class="sok-knapp" type="submit" aria-label="Søk">Søk</button>
      </form>
      <ul class="menu-list" id="menuList">
        <li><p class="menu-state">Henter meny …</p></li>
      </ul>
      <div class="menu-actions">
        <button class="action-btn" id="shareBtn" type="button">
          <span class="action-ico" aria-hidden="true">↗</span>Del appen
        </button>
        <button class="action-btn" id="installBtn" type="button" hidden>
          <span class="action-ico" aria-hidden="true">⤓</span>Installer appen
        </button>
        <p class="action-note" id="actionNote" hidden></p>
      </div>
    </nav>
    <div class="feed" id="feed" aria-live="polite" aria-busy="true">
      <div class="state"><p>Henter nyheter …</p></div>
    </div>

    <!-- Fotballmodulen ligger som soster til feeden og bytter plass med
         den. Innholdet bygges av fotball.js. -->
    <section class="fotball" id="fotball" aria-label="Fotball, beta" hidden>
      <div class="fotball-topp">
        <div class="segment" id="ligaVelger" role="group" aria-label="Liga"></div>
        <div class="segment" id="fotballFaner" role="group" aria-label="Visning"></div>
      </div>
      <div class="fotball-innhold" id="fotballInnhold" aria-live="polite"></div>
    </section>

    <nav class="tabbar" aria-label="Hovedvisning">
      <button class="tab" id="fanenNyheter" type="button" aria-current="true">
        <span class="tab-ico" aria-hidden="true">📰</span>Nyheter
      </button>
      <button class="tab" id="fanenFotball" type="button">
        <span class="tab-ico" aria-hidden="true">⚽</span>Fotball
        <span class="beta" aria-label="beta">beta</span>
      </button>
    </nav>
  </div>

  <div class="detail-wrap" id="detailWrap">
    <div class="detail-shell">
      <button class="corner-close" id="cornerClose" type="button" aria-label="Lukk artikkelen">&times;</button>
      <div class="detail-card" id="detailCard" role="dialog" aria-modal="true" aria-labelledby="detailTitle"></div>
    </div>
  </div>

<script type="module" src="/app.js"></script>

</body>
</html>
