<!DOCTYPE html>
<html lang="nb">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sportsbibelen</title>
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#1B2A87">
<link rel="apple-touch-icon" href="/icons/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Sportsbibelen">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<!--
  Cookielos statistikk. Plausible setter ingen informasjonskapsler og lagrer
  ingen personopplysninger, sa appen trenger ingen samtykkebanner.

  For dette samler noe som helst ma domenet mvp-sb.netlify.app legges til i
  en Plausible-konto. Inntil da er skriptet en stille no-op.
  Skru av statistikk helt: slett denne script-taggen. Koden under tar hoyde
  for at den mangler.
-->
<script defer data-domain="mvp-sb.netlify.app" src="https://plausible.io/js/script.js"></script>
<script>
  // Kjores for rendering. Uten dette rekker standardtemaet a vises et
  // oyeblikk for valget leses inn.
  try {
    var lagret = JSON.parse(localStorage.getItem("sb-visning")) || {};
    if (lagret.svart) document.documentElement.setAttribute("data-theme", "svart");
    if (lagret.stor)  document.documentElement.setAttribute("data-font", "stor");
  } catch (e) { /* privat modus: standardvisning */ }
</script>
<style>
  /* ---------- tema ----------
     Fargene ligger som variabler slik at et tema kun trenger a overstyre
     dem. Verdiene under er appens opprinnelige palett; ekte merkefarger
     fra sportsbibelen.no settes her nar de foreligger. */
  :root {
    --fs: 1;

    /* Merkefarger lest av sportsbibelen.no. Toppfeltet der gar fra dyp
       marinebla til klar bla, siden er lys blahvit og kortene hvite. */
    --bg-page:      #E9F0FA;
    --bg-app:       #FFFFFF;
    --bg-raised:    #DFE8F6;
    --bg-ad:        #F4F7FD;
    --bg-ad-stripe: #EDF3FB;

    --border:        #DCE5F2;
    --border-strong: #C9D6EA;
    --border-ad:     #D3DFF1;
    --border-btn:    #C3D1E8;
    --border-faint:  #E7EDF7;

    --text:        #16224A;
    --text-strong: #0E1836;
    --text-body:   #2E3A5E;
    --text-dim:    #5A6785;
    --text-dimmer: #6E7B99;
    --text-faint:  #8A95AE;

    --accent:        #2A50D8;
    --accent-ink:    #FFFFFF;
    --accent-soft:   #1B2A87;
    --accent-bright: #FFFFFF;

    --ad-g1: #1B2A87;
    --ad-g2: #2A50D8;
    --ad-g3: #223AA8;

    --overlay-hero:  rgba(8,14,38,0.92);
    --on-overlay:     #FFFFFF;
    --on-overlay-dim: #C6D2EA;
    --overlay-scrim: rgba(10,18,45,0.55);

    /* Toppfeltet og det som ligger oppa det. */
    --header-bg:     linear-gradient(100deg, #1B2A87 0%, #2A50D8 100%);
    --header-border: transparent;
    --on-brand:      #FFFFFF;
    --on-brand-dim:  #BFD0FF;
    --logo-ink:      #1B2A87;

    --t-hero:   calc(21px   * var(--fs));
    --t-row:    calc(15.5px * var(--fs));
    --t-detail: calc(20px   * var(--fs));
    --t-body:   calc(15px   * var(--fs));
    --t-excerpt:calc(14px   * var(--fs));
    --t-ad:     calc(16.5px * var(--fs));
    --t-menu:   calc(17px   * var(--fs));
    --t-meta:   calc(11.5px * var(--fs));
    --t-label:  calc(11px   * var(--fs));
  }

  /* Svart lesemodus: ekte svart bunn og hoyere kontrast. Aksenten beholdes,
     ellers mister kategoriene signalet sitt. */
  [data-theme="svart"] {
    --bg-page:      #000000;
    --bg-app:       #000000;
    --bg-raised:    #141414;
    --bg-ad:        #0D0D0D;
    --bg-ad-stripe: #0A0A0A;

    --border:        #242424;
    --border-strong: #303030;
    --border-ad:     #303030;
    --border-btn:    #3A3A3A;
    --border-faint:  #1C1C1C;

    --text:        #FFFFFF;
    --text-strong: #FFFFFF;
    --text-body:   #E4E4E4;
    --text-dim:    #B8B8B8;
    --text-dimmer: #A0A0A0;
    --text-faint:  #8A8A8A;

    /* Aksenten lysnes for a holde kontrasten mot svart. */
    --accent:        #5C82FF;
    --accent-ink:    #00081F;
    --accent-soft:   #9DB4FF;
    --accent-bright: #FFFFFF;

    --ad-g1: #101010;
    --ad-g2: #2A2A2A;
    --ad-g3: #161616;

    --overlay-hero:  rgba(0,0,0,0.94);
    --on-overlay:     #FFFFFF;
    --on-overlay-dim: #B9B9B9;
    --overlay-scrim: rgba(0,0,0,0.78);

    --header-bg:     #000000;
    --header-border: #242424;
    --on-brand:      #FFFFFF;
    --on-brand-dim:  #9DB4FF;
    --logo-ink:      #000000;
  }

  [data-font="stor"] { --fs: 1.2; }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg-page);
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    display: flex;
    justify-content: center;
    padding: 24px 12px;
    min-height: 100vh;
  }

  .phone {
    position: relative;
    width: 390px;
    max-width: 100%;
    background: var(--bg-app);
    border-radius: 28px;
    border: 1px solid var(--border-strong);
    overflow: hidden;
    display: flex;
    flex-direction: column;
    /* Fast høyde stakk utenfor lave skjermer. Krymp med viewporten i stedet. */
    height: 780px;
    height: min(780px, calc(100vh - 48px));
    height: min(780px, calc(100dvh - 48px));
  }

  .head-left {
    display: flex;
    align-items: center;
    gap: 11px;
    min-width: 0;
  }

  /* Hamburgerknappen. Tre streker tegnet i CSS, ingen ikonfil a laste. */
  .menu-btn {
    width: 30px;
    height: 30px;
    padding: 0;
    border: 0;
    background: none;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    border-radius: 6px;
  }

  .bars, .bars::before, .bars::after {
    display: block;
    width: 17px;
    height: 1.5px;
    background: var(--on-brand);
    border-radius: 1px;
  }

  .bars { position: relative; }

  .bars::before, .bars::after {
    content: "";
    position: absolute;
    left: 0;
  }

  .bars::before { top: -5.5px; }
  .bars::after  { top: 5.5px; }

  .menu-btn:focus-visible {
    outline: 2px solid var(--on-brand);
    outline-offset: 2px;
  }

  .menu-close:focus-visible, .menu-item:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }

  /* ---------- menypanel ---------- */

  .menu-panel {
    position: absolute;
    inset: 0;
    z-index: 20;
    background: var(--bg-app);
    display: flex;
    flex-direction: column;
    visibility: hidden;
    transform: translateX(-100%);
    /* visibility slas av forst etter at panelet har skjovet seg ut, og pa
       oyeblikkelig nar det apner. A transisjonere visibility direkte gir
       udefinert oppforsel i kantene. */
    transition: transform 0.22s ease, visibility 0s linear 0.22s;
  }

  .menu-panel.open {
    visibility: visible;
    transform: translateX(0);
    transition: transform 0.22s ease, visibility 0s;
  }

  @media (prefers-reduced-motion: reduce) {
    .menu-panel { transition: none; }
  }

  .menu-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 18px 18px 14px;
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }

  .menu-title {
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 700;
    font-size: 18px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--text);
    margin: 0;
  }

  .menu-close {
    background: none;
    border: 0;
    color: var(--text-dim);
    font-size: 22px;
    line-height: 1;
    padding: 4px 6px;
    cursor: pointer;
    border-radius: 6px;
  }

  .menu-tools {
    display: flex;
    align-items: center;
    gap: 6px;
  }

  /* Bevisst i faste piksler: dette er ramme rundt innholdet, ikke innhold,
     og skal ikke vokse nar leseren ber om storre tekst. */
  .tool-btn {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    padding: 5px 9px;
    border: 1px solid var(--border-btn);
    border-radius: 999px;
    background: none;
    color: var(--text-dim);
    font-family: inherit;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.02em;
    white-space: nowrap;
    cursor: pointer;
  }

  .tool-btn[aria-pressed="true"] {
    border-color: var(--accent);
    color: var(--accent);
  }

  .tool-btn:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }

  .tool-ico { font-size: 12px; line-height: 1; }

  .menu-list {
    list-style: none;
    margin: 0;
    padding: 8px 0 24px;
    overflow-y: auto;
    flex: 1;
  }

  .menu-item {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 12px;
    width: 100%;
    padding: 13px 18px;
    background: none;
    border: 0;
    border-bottom: 1px solid var(--border-faint);
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 600;
    font-size: var(--t-menu);
    letter-spacing: 0.01em;
    color: var(--text);
    text-align: left;
    cursor: pointer;
  }

  .menu-item .count {
    font-family: 'Inter', sans-serif;
    font-weight: 500;
    font-size: 11px;
    color: var(--text-dimmer);
    font-variant-numeric: tabular-nums;
    flex-shrink: 0;
  }

  .menu-item[aria-current="true"] { color: var(--accent); }

  .menu-item[aria-current="true"] .count { color: var(--accent); }

  .menu-actions {
    flex-shrink: 0;
    border-top: 1px solid var(--border);
    padding: 12px 18px 18px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .action-btn {
    display: flex;
    align-items: center;
    gap: 9px;
    width: 100%;
    padding: 11px 13px;
    border: 1px solid var(--border-btn);
    border-radius: 8px;
    background: none;
    color: var(--text);
    font-family: inherit;
    font-size: 13.5px;
    font-weight: 600;
    text-align: left;
    cursor: pointer;
  }

  .action-btn:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }

  .action-ico {
    font-size: 15px;
    line-height: 1;
    color: var(--accent);
  }

  .action-note {
    margin: 2px 0 0;
    font-size: 12px;
    line-height: 1.5;
    color: var(--text-dim);
  }

  .menu-state {
    padding: 20px 18px;
    font-size: 13px;
    color: var(--text-dimmer);
  }

  /* Viser hvilken del av feeden du star i, nar det ikke er alle saker. */
  .filter-tag {
    font-size: 11px;
    color: var(--on-brand-dim);
    font-weight: 600;
    letter-spacing: 0.02em;
  }

  .header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 16px;
    background: var(--header-bg);
    border-bottom: 1px solid var(--header-border);
    flex-shrink: 0;
  }

  /* Ordmerket fra nettsiden: hvit ramme, SPORTS hvit pa bla og BIBELEN
     bla pa hvit blokk. */
  .logo {
    display: inline-flex;
    align-items: stretch;
    margin: 0;
    border: 2px solid var(--on-brand);
    border-radius: 2px;
    overflow: hidden;
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 700;
    font-size: 17px;
    line-height: 1;
    letter-spacing: 0.04em;
  }

  .logo-a {
    padding: 5px 6px 4px 7px;
    background: var(--on-brand);
    color: var(--logo-ink);
  }

  .logo-b {
    padding: 5px 7px 4px 6px;
    border-left: 2px solid var(--on-brand);
    color: var(--on-brand);
  }

  .feed {
    overflow-y: auto;
    flex: 1;
    padding: 14px 14px 24px;
  }

  .state {
    color: var(--text-dimmer);
    font-size: 14px;
    text-align: center;
    padding: 60px 20px;
  }

  .state p { margin: 0 0 14px; }

  /* Felles nullstilling for de klikkbare kortene, som nå er ekte
     <button>-elementer slik at de kan nås med tastatur. */
  .card-btn {
    display: block;
    width: 100%;
    margin: 0;
    padding: 0;
    border: 0;
    background: none;
    font: inherit;
    color: inherit;
    text-align: left;
    cursor: pointer;
  }

  .card-btn:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }

  .hero {
    position: relative;
    border-radius: 16px;
    overflow: hidden;
    margin-bottom: 18px;
    background: var(--bg-raised);
    height: 220px;
  }

  .hero img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  .hero-overlay {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    padding: 16px;
    background: linear-gradient(transparent, var(--overlay-hero));
  }

  .cat-pill {
    display: inline-block;
    font-size: var(--t-label);
    color: var(--accent-ink);
    background: var(--accent);
    padding: 3px 9px;
    border-radius: 5px;
    font-weight: 600;
    margin-bottom: 8px;
  }

  .hero-title {
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 600;
    font-size: var(--t-hero);
    line-height: 1.2;
    /* Ligger oppa gradienten, ikke pa kortbakgrunnen. */
    color: var(--on-overlay);
    margin: 0;
  }

  /* Kun i toppsakens overlegg. */
  .meta {
    font-size: var(--t-meta);
    color: var(--on-overlay-dim);
    margin-top: 6px;
  }

  .row {
    display: flex;
    gap: 12px;
    padding: 12px 0;
    border-bottom: 1px solid var(--border);
  }

  .row img, .row .thumb-empty {
    width: 76px;
    height: 76px;
    border-radius: 10px;
    object-fit: cover;
    flex-shrink: 0;
    background: var(--bg-raised);
  }

  .row-body {
    display: flex;
    flex-direction: column;
    justify-content: center;
    min-width: 0;
  }

  .row-cat {
    font-size: var(--t-label);
    color: var(--accent);
    font-weight: 600;
    margin-bottom: 4px;
  }

  .row-title {
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 600;
    font-size: var(--t-row);
    line-height: 1.25;
    color: var(--text);
    margin: 0;
    display: -webkit-box;
    -webkit-line-clamp: 3;
    line-clamp: 3;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }

  .row-meta {
    font-size: var(--t-meta);
    color: var(--text-dimmer);
    margin-top: 6px;
  }

  /* ---------- annonseplasser ---------- */

  /* Merket star forst i leseretningen, over selve annonsen, og er lest opp
     av skjermleser via aria-label pa blokka. Markedsforingsloven krever at
     reklame tydelig framstar som reklame, sa dette er ikke bare pynt. */
  .ad-label {
    display: block;
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0.13em;
    text-transform: uppercase;
    color: var(--text-dimmer);
  }

  .ad-banner {
    margin: 14px 0;
    border-radius: 12px;
    overflow: hidden;
    background: var(--bg-ad);
    border: 1px solid var(--border-ad);
  }

  .ad-banner .ad-label { padding: 9px 13px 0; }

  .ad-banner .ad-creative {
    height: 120px;
    margin-top: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 700;
    font-size: 27px;
    letter-spacing: 0.1em;
    color: var(--accent-bright);
    background: linear-gradient(125deg, var(--ad-g1) 0%, var(--ad-g2) 55%, var(--ad-g3) 100%);
  }

  .ad-banner .ad-body {
    padding: 12px 13px 14px;
    display: flex;
    flex-direction: column;
    gap: 9px;
  }

  .ad-headline {
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 600;
    font-size: var(--t-ad);
    line-height: 1.2;
    color: var(--text);
    margin: 0;
  }

  .ad-cta {
    align-self: flex-start;
    font-size: 11.5px;
    font-weight: 600;
    color: var(--accent-ink);
    background: var(--accent);
    padding: 6px 12px;
    border-radius: 5px;
  }

  /* Stripa gar helt ut i kanten og bryter feedens marg. Det ene grepet er
     det som gjor den umiskjennelig, uten at den trenger a vaere stor. */
  .ad-stripe {
    margin: 14px -14px;
    padding: 14px;
    background: var(--bg-ad-stripe);
    border-top: 1px solid var(--border-ad);
    border-bottom: 1px solid var(--border-ad);
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .ad-stripe .ad-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }

  .ad-stripe .ad-brand {
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 700;
    font-size: 16px;
    letter-spacing: 0.08em;
    color: var(--accent-soft);
  }

  .ad-sub { font-size: 11.5px; color: var(--text-dimmer); }

  .detail-wrap {
    position: fixed;
    inset: 0;
    background: var(--overlay-scrim);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 10;
  }

  .detail-wrap.open {
    display: flex;
  }

  .detail-card {
    width: 390px;
    max-width: 92%;
    max-height: 88%;
    overflow-y: auto;
    background: var(--bg-app);
    border-radius: 18px;
    border: 1px solid var(--border-strong);
    padding: 0 0 20px;
  }

  .detail-card img {
    width: 100%;
    height: 180px;
    object-fit: cover;
    display: block;
  }

  .detail-body {
    padding: 16px 18px 0;
  }

  .detail-title {
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 600;
    font-size: var(--t-detail);
    line-height: 1.25;
    color: var(--text-strong);
    margin: 0 0 8px;
  }

  .detail-excerpt {
    font-size: var(--t-excerpt);
    line-height: 1.6;
    color: var(--text-body);
  }

  .detail-content {
    font-size: var(--t-body);
    line-height: 1.7;
    color: var(--text-body);
  }

  .detail-content p { margin: 0 0 14px; }

  .detail-content h2,
  .detail-content h3,
  .detail-content h4 {
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 600;
    color: var(--text);
    line-height: 1.3;
    margin: 22px 0 8px;
  }

  .detail-content h2 { font-size: 18px; }
  .detail-content h3 { font-size: 16.5px; }
  .detail-content h4 { font-size: 15px; }

  .detail-content img {
    width: 100%;
    height: auto;
    display: block;
    border-radius: 10px;
    margin: 6px 0 12px;
  }

  .detail-content figure { margin: 0 0 14px; }

  .detail-content figcaption {
    font-size: 12px;
    line-height: 1.45;
    color: var(--text-dimmer);
  }

  .detail-content iframe {
    display: block;
    width: 100%;
    aspect-ratio: 16 / 9;
    height: auto;
    border: 0;
    border-radius: 10px;
    margin: 6px 0 14px;
    background: var(--bg-raised);
  }

  .detail-content a { color: var(--accent); }

  .detail-content ul, .detail-content ol {
    margin: 0 0 14px;
    padding-left: 20px;
  }

  .detail-content li { margin-bottom: 6px; }

  .detail-content blockquote {
    margin: 0 0 14px;
    padding-left: 14px;
    border-left: 2px solid var(--border-btn);
    color: var(--text-dim);
  }

  .detail-content pre {
    overflow-x: auto;
    background: var(--bg-raised);
    padding: 10px 12px;
    border-radius: 8px;
    font-size: 12.5px;
  }

  .detail-content table {
    width: 100%;
    border-collapse: collapse;
    font-size: 13px;
    margin-bottom: 14px;
  }

  .detail-content th, .detail-content td {
    border-bottom: 1px solid var(--border);
    padding: 6px 8px;
    text-align: left;
  }

  .read-link {
    display: inline-block;
    margin-top: 4px;
    font-size: 13px;
    font-weight: 600;
    color: var(--accent);
  }

  .close-btn, .retry-btn {
    display: block;
    margin: 16px auto 0;
    background: none;
    border: 1px solid var(--border-btn);
    color: var(--text-dim);
    border-radius: 8px;
    padding: 8px 16px;
    font-size: 13px;
    font-family: inherit;
    cursor: pointer;
  }

  .close-btn:focus-visible, .retry-btn:focus-visible, .read-link:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }

  .err-details {
    margin-top: 22px;
    text-align: left;
    font-size: 11.5px;
    color: var(--text-faint);
  }

  .err-details summary {
    cursor: pointer;
    text-align: center;
    margin-bottom: 8px;
  }

  .err-line {
    margin: 0 0 6px;
    word-break: break-word;
    line-height: 1.45;
  }
</style>
</head>
<body>

  <div class="phone">
    <div class="header">
      <div class="head-left">
        <button class="menu-btn" id="menuBtn" type="button"
                aria-label="Åpne meny" aria-expanded="false" aria-controls="menuPanel">
          <span class="bars" aria-hidden="true"></span>
        </button>
        <h1 class="logo"><span class="logo-a">SPORTS</span><span class="logo-b">BIBELEN</span></h1>
        <span class="filter-tag" id="filterTag"></span>
      </div>
    </div>

    <nav class="menu-panel" id="menuPanel" aria-label="Hovedmeny">
      <div class="menu-head">
        <p class="menu-title">Meny</p>
        <div class="menu-tools">
          <button class="tool-btn" id="themeBtn" type="button" aria-pressed="false">
            <span class="tool-ico" aria-hidden="true">◐</span>Svart
          </button>
          <button class="tool-btn" id="fontBtn" type="button" aria-pressed="false">
            <span class="tool-ico" aria-hidden="true">A</span>Større
          </button>
          <button class="menu-close" id="menuClose" type="button" aria-label="Lukk meny">&times;</button>
        </div>
      </div>
      <ul class="menu-list" id="menuList">
        <li><p class="menu-state">Henter meny …</p></li>
      </ul>
      <div class="menu-actions">
        <button class="action-btn" id="shareBtn" type="button">
          <span class="action-ico" aria-hidden="true">↗</span>Del appen
        </button>
        <button class="action-btn" id="installBtn" type="button" hidden>
          <span class="action-ico" aria-hidden="true">⤓</span>Installer appen
        </button>
        <p class="action-note" id="actionNote" hidden></p>
      </div>
    </nav>
    <div class="feed" id="feed" aria-live="polite" aria-busy="true">
      <div class="state"><p>Henter nyheter …</p></div>
    </div>
  </div>

  <div class="detail-wrap" id="detailWrap">
    <div class="detail-card" id="detailCard" role="dialog" aria-modal="true" aria-labelledby="detailTitle"></div>
  </div>

<script>
  "use strict";

  // Bytt WP_HOST til din egen WordPress-side når som helst.
  const WP_HOST  = "https://sportsbibelen.no";
  const WP_QUERY = "?_embed=1&per_page=12&orderby=date&order=desc";
  const WP_URL   = WP_HOST + "/wp-json/wp/v2/posts" + WP_QUERY;

  // Feeden hentes fra første kilde som svarer med gyldig JSON.
  //  1. Samme domene via Netlify-proxyen (se netlify.toml) — ingen tredjepart,
  //     ingen CORS-problemer. Dette er den normale veien.
  //  2. Direkte mot WordPress som reserve. Virker kun hvis serveren sender
  //     Access-Control-Allow-Origin, men koster ingenting å forsøke hvis
  //     proxyen skulle svikte.
  //
  // Den tidligere offentlige CORS-proxyen er fjernet med vilje: den var
  // ratelimitet og uten SLA, og var årsaken til at feeden ble stående tom.
  function catParam(categoryId) {
    return categoryId ? "&categories=" + encodeURIComponent(categoryId) : "";
  }

  function postSources(categoryId) {
    return sourcesFor(WP_QUERY + catParam(categoryId));
  }

  // Samme vindu som feeden, men kun id og endringstidspunkt. _fields kutter
  // svaret fra full brodtekst for tolv saker til noen fa hundre byte, sa
  // dette er billig nok til a kjore hvert femte minutt.
  const SIG_QUERY = "?per_page=12&orderby=date&order=desc&_fields=id,modified_gmt";

  function signatureSources(categoryId) {
    return sourcesFor(SIG_QUERY + catParam(categoryId));
  }

  function sourcesFor(query) {
    return [
      { name: "Netlify-proxy (/wp-api)", url: "/wp-api/posts" + query },
      { name: "Direkte mot WordPress",   url: WP_HOST + "/wp-json/wp/v2/posts" + query }
    ];
  }

  // Fanger nye saker, redigerte saker, ny rekkefolge og saker som er
  // fjernet - alt som ville endret feeden.
  function feedSignature(list) {
    return list.map((post) =>
      String(post.id) + ":" + (post.modified_gmt || post.date_gmt || "")
    ).join(",");
  }

  // Menyen bygges av kategoriene. WordPress sitt menyendepunkt
  // (/wp/v2/menu-items) krever normalt innlogging, mens kategoriene er
  // offentlige — og pa en nyhetsside er de i praksis toppmenyen.
  // Har dere en handplukket meny som avviker, kan den settes her i stedet.
  const MENU_OVERRIDE = null;   // f.eks. [{ id: 12, name: "Fotball" }, …]

  const CAT_QUERY = "?per_page=20&orderby=count&order=desc&hide_empty=true";

  function categorySources() {
    return [
      { name: "Netlify-proxy (/wp-api)", url: "/wp-api/categories" + CAT_QUERY },
      { name: "Direkte mot WordPress",   url: WP_HOST + "/wp-json/wp/v2/categories" + CAT_QUERY }
    ];
  }

  const REQUEST_TIMEOUT_MS = 12000;
  const REFRESH_MS = 5 * 60 * 1000;

  let hasContent = false;
  let lastFocused = null;
  let activeCategory = null;      // null = alle saker
  let lastSignature = null;       // feedens tilstand ved forrige vellykkede lasting
  let menuLoaded = false;

  /* ---------- små DOM-hjelpere ---------- */

  // Alt tekstinnhold settes via textContent, aldri via innerHTML. Det er det
  // som gjør feeden trygg selv om innholdet kommer via en tredjepartsproxy.
  function el(tag, className, text) {
    const node = document.createElement(tag);
    if (className) node.className = className;
    if (text != null) node.textContent = text;
    return node;
  }

  // Slipper kun gjennom http/https, slik at en manipulert respons ikke kan
  // smugle inn javascript:-URL-er i src eller href.
  function safeUrl(value) {
    if (!value) return null;
    try {
      const u = new URL(value, location.href);
      return (u.protocol === "http:" || u.protocol === "https:") ? u.href : null;
    } catch (err) {
      return null;
    }
  }

  function imageEl(url, lazy) {
    const img = document.createElement("img");
    img.src = url;
    img.alt = "";
    img.loading = lazy ? "lazy" : "eager";
    return img;
  }

  /* ---------- innholdshjelpere ---------- */

  // WordPress leverer titler som HTML. Vi henter ut ren tekst med textContent,
  // som allerede dekoder entiteter én gang — å dekode en gang til ville gjort
  // "&lt;img onerror=...&gt;" om til en levende tag igjen.
  function stripHtml(html) {
    if (!html) return "";
    const div = document.createElement("div");
    div.innerHTML = html;
    return (div.textContent || "").trim();
  }

  // `date` er sidens lokale tid uten tidssone, og ble tolket som leserens
  // lokale tid. `date_gmt` er UTC og gir riktig tidspunkt for alle.
  function postDate(post) {
    const raw = post.date_gmt ? post.date_gmt + "Z" : post.date;
    const d = new Date(raw);
    return Number.isFinite(d.getTime()) ? d : null;
  }

  function timeAgo(date) {
    if (!date) return "";
    const mins = Math.floor((Date.now() - date.getTime()) / 60000);
    if (mins < 1) return "nå nettopp";
    if (mins < 60) return mins + " min siden";
    const hours = Math.floor(mins / 60);
    if (hours < 24) return hours + "t siden";
    const days = Math.floor(hours / 24);
    if (days < 7) return days + "d siden";
    return date.toLocaleDateString("nb-NO", { day: "numeric", month: "short" });
  }

  function timeEl(post, className) {
    const date = postDate(post);
    const node = el("time", className, timeAgo(date));
    if (date) node.dateTime = date.toISOString();
    return node;
  }

  function getImage(post) {
    const embedded = post._embedded || {};
    const media = embedded["wp:featuredmedia"] && embedded["wp:featuredmedia"][0];
    return safeUrl(media && media.source_url);
  }

  function getCategory(post) {
    const embedded = post._embedded || {};
    const terms = embedded["wp:term"] && embedded["wp:term"][0];
    return terms && terms.length > 0 ? stripHtml(terms[0].name) : null;
  }

  function getTitle(post) {
    return stripHtml(post.title && post.title.rendered) || "Uten tittel";
  }

  /* ---------- statistikk ---------- */

  // Sender en hendelse hvis Plausible er lastet, og gjør ingenting hvis den
  // ikke er det. Appen skal aldri feile fordi statistikk mangler.
  function track(event, props) {
    try {
      if (typeof window.plausible === "function") {
        window.plausible(event, props ? { props: props } : undefined);
      }
    } catch (err) {
      /* statistikk skal aldri velte lesingen */
    }
  }

  /* ---------- rensing av artikkel-HTML ---------- */

  // Artikkelteksten fra WordPress er HTML, og skal rendres som HTML. Derfor
  // er dette en allowlist, ikke en blocklist: en tag slipper gjennom bare
  // hvis den star her. En ukjent tag blir aldri sluppet gjennom fordi den
  // tilfeldigvis manglet pa en liste over farlige ting.
  const ALLOWED = {
    P: [], BR: [], HR: [], DIV: [], SPAN: [],
    STRONG: [], B: [], EM: [], I: [], U: [], S: [], SUP: [], SUB: [], MARK: [],
    H2: [], H3: [], H4: [], H5: [], H6: [],
    UL: [], OL: [], LI: [],
    BLOCKQUOTE: [], PRE: [], CODE: [],
    FIGURE: [], FIGCAPTION: [],
    TABLE: [], THEAD: [], TBODY: [], TFOOT: [], TR: [], TH: [], TD: [],
    A: ["href"],
    IMG: ["src", "alt"],
    IFRAME: ["src", "title", "allowfullscreen"]
  };

  // iframe er den farligste taggen vi slipper gjennom, sa src ma peke pa et
  // av disse vertsnavnene. Sammenligningen er mot hele hostname, ikke en
  // delstreng: ellers ville youtube.com.angriper.no sluppet gjennom.
  const VIDEO_HOSTS = [
    "youtube.com", "www.youtube.com",
    "youtube-nocookie.com", "www.youtube-nocookie.com",
    "player.vimeo.com", "vimeo.com"
  ];

  function videoUrl(value) {
    const url = safeUrl(value);
    if (!url) return null;
    try {
      const parsed = new URL(url);
      if (parsed.protocol !== "https:") return null;
      return VIDEO_HOSTS.indexOf(parsed.hostname.toLowerCase()) === -1 ? null : url;
    } catch (err) {
      return null;
    }
  }

  // Disse fjernes med innholdet sitt. For alle andre ukjente tagger beholder
  // vi teksten inni, men kaster selve elementet.
  const DROPPED = {
    SCRIPT: 1, STYLE: 1, OBJECT: 1, EMBED: 1, LINK: 1, META: 1,
    BASE: 1, FORM: 1, INPUT: 1, BUTTON: 1, SELECT: 1, TEXTAREA: 1,
    NOSCRIPT: 1, TEMPLATE: 1, SVG: 1, MATH: 1
  };

  function sanitizeHtml(html) {
    // <template> parser HTML uten a aktivere noe: bilder lastes ikke, og
    // onerror utloses ikke. Et vanlig <div> ville faktisk lastet bildene
    // mens vi holdt pa a rense dem.
    const tpl = document.createElement("template");
    tpl.innerHTML = html || "";
    cleanChildren(tpl.content);
    return tpl.content;
  }

  function cleanChildren(root) {
    Array.prototype.slice.call(root.childNodes).forEach((node) => {
      if (node.nodeType === Node.TEXT_NODE) return;

      if (node.nodeType !== Node.ELEMENT_NODE) {
        node.remove();           // kommentarer og alt annet rart
        return;
      }

      const tag = node.tagName.toUpperCase();

      if (DROPPED[tag]) {
        node.remove();
        return;
      }

      if (!Object.prototype.hasOwnProperty.call(ALLOWED, tag)) {
        cleanChildren(node);
        const parent = node.parentNode;
        while (node.firstChild) parent.insertBefore(node.firstChild, node);
        node.remove();
        return;
      }

      // Fjerner alle attributter som ikke star pa listen. Det tar blant
      // annet alle on*-handlere og style i ett jafs.
      const allowed = ALLOWED[tag];
      Array.prototype.slice.call(node.attributes).forEach((attr) => {
        if (allowed.indexOf(attr.name.toLowerCase()) === -1) {
          node.removeAttribute(attr.name);
        }
      });

      if (tag === "A") {
        const href = safeUrl(node.getAttribute("href"));
        if (href) {
          node.setAttribute("href", href);
          node.setAttribute("target", "_blank");
          node.setAttribute("rel", "noopener noreferrer");
        } else {
          node.removeAttribute("href");
        }
      }

      if (tag === "IMG") {
        const src = safeUrl(node.getAttribute("src"));
        if (!src) {
          node.remove();
          return;
        }
        node.setAttribute("src", src);
        node.setAttribute("loading", "lazy");
      }

      if (tag === "IFRAME") {
        const src = videoUrl(node.getAttribute("src"));
        if (!src) {
          node.remove();      // alt annet enn YouTube og Vimeo faller bort
          return;
        }
        node.setAttribute("src", src);
        node.setAttribute("loading", "lazy");
        node.setAttribute("referrerpolicy", "strict-origin-when-cross-origin");
        node.setAttribute("allowfullscreen", "");
      }

      cleanChildren(node);
    });
  }

  /* ---------- henting ---------- */

  function timeoutSignal(ms) {
    if (typeof AbortSignal !== "undefined" && AbortSignal.timeout) {
      return AbortSignal.timeout(ms);
    }
    const controller = new AbortController();
    setTimeout(() => controller.abort(), ms);
    return controller.signal;
  }

  // Kaster med en beskrivende melding i stedet for å svelge feilen, slik at
  // en tom feed faktisk kan feilsøkes.
  async function fetchList(url, extra) {
    const options = {
      headers: { "Accept": "application/json" },
      signal: timeoutSignal(REQUEST_TIMEOUT_MS)
    };
    if (extra && extra.cache) options.cache = extra.cache;

    const res = await fetch(url, options);
    const text = await res.text();

    if (!res.ok) throw new Error("HTTP " + res.status + " " + res.statusText);

    let data;
    try {
      data = JSON.parse(text);
    } catch (err) {
      const preview = text.slice(0, 70).replace(/\s+/g, " ");
      throw new Error("Svaret var ikke JSON (fikk: " + preview + "…)");
    }

    if (data && !Array.isArray(data) && data.code) {
      throw new Error("WordPress svarte med feilen «" + data.code + "»");
    }
    if (!Array.isArray(data)) {
      throw new Error("Forventet en liste med artikler, fikk " + typeof data);
    }
    return data;
  }

  // Hvor nar toppen leseren ma vaere for at en bakgrunnsoppdatering skal
  // fa bygge feeden pa nytt.
  const TOP_THRESHOLD = 40;

  // Henter kun id og endringstidspunkt for de samme tolv sakene og
  // sammenligner med forrige lasting. Klarer vi ikke å sjekke, sier vi at
  // noe kan være nytt og henter alt som før — sjekken skal aldri kunne
  // fryse feeden fast.
  async function nothingNew() {
    if (!lastSignature) return false;

    for (const source of signatureSources(activeCategory)) {
      try {
        // Ingen mellomlagring på selve sjekken: et cachet svar ville sagt
        // «uendret» i det uendelige.
        const list = await fetchList(source.url, { cache: "no-store" });
        return feedSignature(list) === lastSignature;
      } catch (err) {
        console.error("[Sportsbibelen] endringssjekk · " + source.name + " feilet:", err);
      }
    }
    return false;
  }

  async function loadFeed(options) {
    const silent = options && options.silent;
    const feed = document.getElementById("feed");

    if (silent && hasContent) {
      // Står leseren nede i listen, lar vi feeden være. Ellers ville nye
      // saker blitt lagt inn over vedkommende, som da blir stående igjen
      // langt nede i en liste som har endret seg under føttene på dem.
      if (feed.scrollTop > TOP_THRESHOLD) return;

      // Er ingenting endret, er det ingen grunn til å hente tolv saker med
      // full brødtekst på nytt.
      if (await nothingNew()) return;
    }

    if (!silent) {
      const loading = el("div", "state");
      loading.appendChild(el("p", null, "Henter nyheter …"));
      feed.setAttribute("aria-busy", "true");
      feed.replaceChildren(loading);
    }

    const problems = [];
    for (const source of postSources(activeCategory)) {
      try {
        const posts = await fetchList(source.url);
        renderFeed(posts);
        lastSignature = feedSignature(posts);
        hasContent = posts.length > 0;
        feed.setAttribute("aria-busy", "false");
        return;
      } catch (err) {
        console.error("[Sportsbibelen] " + source.name + " feilet:", err);
        problems.push(source.name + " — " + (err && err.message ? err.message : String(err)));
      }
    }

    feed.setAttribute("aria-busy", "false");
    // Uten en kjent tilstand må neste oppdatering hente alt.
    lastSignature = null;

    // Gjør feilen synlig i statistikken, slik at vi oppdager en feed som
    // slutter å virke uten å vente på at noen melder fra.
    track("Feed feilet", { årsak: (problems[0] || "ukjent").slice(0, 80) });

    // Ved bakgrunnsoppdatering beholder vi det som allerede står på skjermen.
    if (silent && hasContent) return;
    showError(problems);
  }

  /* ---------- annonser ---------- */

  // Én annonseplass etter hver fjerde sak, med toppsaken talt som den
  // første. Feeden henter tolv saker, så det gir to plasser per lasting.
  const ADS_EVERY = 4;

  // Plassholdere. Annonsørene her er oppdiktede. Når ekte annonser skal inn,
  // erstattes denne listen av data fra annonsesystemet — formatet er det
  // samme, og rekkefølgen i listen bestemmer blandingen av de to formatene.
  const ADS = [
    {
      format: "banner",
      brand: "NORDBANE",
      headline: "Tre måneder trening. Ingen binding.",
      cta: "Se tilbudet"
    },
    {
      format: "stripe",
      brand: "PADELHUSET",
      headline: "Fire nye baner åpner i Bergen i oktober",
      sub: "Book time · padelhuset.no"
    },
    {
      format: "banner",
      brand: "SPRINTA",
      headline: "Nye Sprinta Terreng. Bygget for norsk høst.",
      cta: "Se skoene"
    },
    {
      format: "stripe",
      brand: "TRIBUNE",
      headline: "Billetter til høstens toppkamper",
      sub: "tribune.no"
    }
  ];

  function buildAd(ad, slot) {
    const box = el("div", "ad-" + ad.format);
    box.setAttribute("role", "group");
    // Merkingen må også nå skjermlesere, ikke bare øyet.
    box.setAttribute("aria-label", "Reklame fra " + ad.brand);

    if (ad.format === "stripe") {
      const top = el("div", "ad-top");
      top.appendChild(el("span", "ad-label", "Reklame"));
      top.appendChild(el("span", "ad-brand", ad.brand));
      box.appendChild(top);
      box.appendChild(el("p", "ad-headline", ad.headline));
      if (ad.sub) box.appendChild(el("span", "ad-sub", ad.sub));
    } else {
      box.appendChild(el("span", "ad-label", "Reklame"));
      // Plassholder-flate. Ekte annonsemateriell settes inn her.
      box.appendChild(el("div", "ad-creative", ad.brand));
      const body = el("div", "ad-body");
      body.appendChild(el("p", "ad-headline", ad.headline));
      if (ad.cta) body.appendChild(el("span", "ad-cta", ad.cta));
      box.appendChild(body);
    }

    track("Annonse vist", { annonsor: ad.brand, plass: String(slot) });
    return box;
  }

  /* ---------- rendering ---------- */

  function renderFeed(posts) {
    const feed = document.getElementById("feed");
    feed.replaceChildren();

    if (!posts.length) {
      const state = el("div", "state");
      state.appendChild(el("p", null, "Ingen artikler funnet."));
      feed.appendChild(state);
      return;
    }

    // Ny liste, ny start. Uten dette arver den nye feeden rulleposisjonen
    // fra den forrige, som sjelden peker pa det samme innholdet.
    feed.scrollTop = 0;

    feed.appendChild(buildHero(posts[0]));

    const rows = posts.slice(1);
    let shown = 1;      // toppsaken teller som den første saken
    let slot = 0;

    rows.forEach((post, index) => {
      feed.appendChild(buildRow(post));
      shown += 1;

      // Ingen annonse etter siste sak: der ville den bare sett ut som en
      // avslutning på feeden.
      const isLast = index === rows.length - 1;
      if (!isLast && shown % ADS_EVERY === 0) {
        feed.appendChild(buildAd(ADS[slot % ADS.length], slot + 1));
        slot += 1;
      }
    });
  }

  function buildHero(post) {
    const button = el("button", "card-btn hero");
    button.type = "button";

    const img = getImage(post);
    if (img) button.appendChild(imageEl(img, false));

    const overlay = el("div", "hero-overlay");
    const cat = getCategory(post);
    if (cat) overlay.appendChild(el("span", "cat-pill", cat));
    overlay.appendChild(el("h2", "hero-title", getTitle(post)));
    overlay.appendChild(timeEl(post, "meta"));
    button.appendChild(overlay);

    button.addEventListener("click", () => openDetail(post, button));
    return button;
  }

  function buildRow(post) {
    const button = el("button", "card-btn row");
    button.type = "button";

    const img = getImage(post);
    button.appendChild(img ? imageEl(img, true) : el("div", "thumb-empty"));

    const body = el("div", "row-body");
    const cat = getCategory(post);
    if (cat) body.appendChild(el("span", "row-cat", cat));
    body.appendChild(el("h3", "row-title", getTitle(post)));
    body.appendChild(timeEl(post, "row-meta"));
    button.appendChild(body);

    button.addEventListener("click", () => openDetail(post, button));
    return button;
  }

  function showError(problems) {
    const feed = document.getElementById("feed");
    const state = el("div", "state");
    state.appendChild(el("p", null, "Klarte ikke å hente nyheter akkurat nå."));

    const retry = el("button", "retry-btn", "Prøv igjen");
    retry.type = "button";
    retry.addEventListener("click", () => loadFeed());
    state.appendChild(retry);

    if (problems.length) {
      const details = document.createElement("details");
      details.className = "err-details";
      details.appendChild(el("summary", null, "Tekniske detaljer"));
      problems.forEach((line) => details.appendChild(el("p", "err-line", line)));
      state.appendChild(details);
    }

    feed.replaceChildren(state);
  }

  /* ---------- visningsvalg ---------- */

  const PREF_KEY = "sb-visning";

  function readPrefs() {
    try {
      return JSON.parse(localStorage.getItem(PREF_KEY)) || {};
    } catch (err) {
      return {};
    }
  }

  function savePrefs(value) {
    try {
      localStorage.setItem(PREF_KEY, JSON.stringify(value));
    } catch (err) {
      // Privat modus eller blokkerte informasjonskapsler: valget gjelder
      // da bare denne økta, og det er greit.
    }
  }

  function applyPrefs(value) {
    const root = document.documentElement;

    if (value.svart) root.setAttribute("data-theme", "svart");
    else root.removeAttribute("data-theme");

    if (value.stor) root.setAttribute("data-font", "stor");
    else root.removeAttribute("data-font");

    document.getElementById("themeBtn").setAttribute("aria-pressed", value.svart ? "true" : "false");
    document.getElementById("fontBtn").setAttribute("aria-pressed", value.stor ? "true" : "false");
  }

  const prefs = readPrefs();
  applyPrefs(prefs);

  document.getElementById("themeBtn").addEventListener("click", () => {
    prefs.svart = !prefs.svart;
    applyPrefs(prefs);
    savePrefs(prefs);
    track("Tema byttet", { tema: prefs.svart ? "svart" : "original" });
  });

  document.getElementById("fontBtn").addEventListener("click", () => {
    prefs.stor = !prefs.stor;
    applyPrefs(prefs);
    savePrefs(prefs);
    track("Skriftstørrelse byttet", { størrelse: prefs.stor ? "stor" : "normal" });
  });

  /* ---------- del og installer ---------- */

  const DEL_TEKST = "Sportsbibelen — siste nytt fra sportens verden";
  let installasjonsvarsel = null;

  function visNotat(tekst) {
    const notat = document.getElementById("actionNote");
    notat.textContent = tekst;
    notat.hidden = !tekst;
  }

  function alleredeInstallert() {
    return window.matchMedia("(display-mode: standalone)").matches ||
           window.navigator.standalone === true;
  }

  function erIos() {
    return /iphone|ipad|ipod/i.test(navigator.userAgent);
  }

  document.getElementById("shareBtn").addEventListener("click", async () => {
    const data = { title: "Sportsbibelen", text: DEL_TEKST, url: location.origin + "/" };
    try {
      if (navigator.share) {
        await navigator.share(data);
        track("App delt", { metode: "deling" });
        return;
      }
      // Ingen delingsmeny: legg lenken på utklippstavlen i stedet.
      await navigator.clipboard.writeText(data.url);
      visNotat("Lenken er kopiert: " + data.url);
      track("App delt", { metode: "utklippstavle" });
    } catch (err) {
      // Avbrutt deling er ikke en feil, men manglende utklippstavle er noe
      // leseren må kunne komme videre fra.
      if (err && err.name === "AbortError") return;
      visNotat("Kopier lenken selv: " + data.url);
    }
  });

  const installKnapp = document.getElementById("installBtn");

  window.addEventListener("beforeinstallprompt", (e) => {
    // Vi vil vise vår egen knapp i menyen, ikke nettleserens banner.
    e.preventDefault();
    installasjonsvarsel = e;
    if (!alleredeInstallert()) installKnapp.hidden = false;
  });

  // iOS har ingen installasjonshendelse. Der er eneste vei en instruksjon.
  if (erIos() && !alleredeInstallert()) {
    installKnapp.hidden = false;
  }

  installKnapp.addEventListener("click", async () => {
    if (installasjonsvarsel) {
      installasjonsvarsel.prompt();
      const svar = await installasjonsvarsel.userChoice;
      track("Installasjon", { valg: svar.outcome });
      installasjonsvarsel = null;
      if (svar.outcome === "accepted") installKnapp.hidden = true;
      return;
    }
    visNotat("Trykk Del nederst i Safari, og velg «Legg til på Hjem-skjerm».");
    track("Installasjon", { valg: "ios-veiledning" });
  });

  window.addEventListener("appinstalled", () => {
    installKnapp.hidden = true;
    visNotat("");
    track("Installasjon", { valg: "fullfort" });
  });

  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("/sw.js").catch((err) => {
        // Appen skal virke uten. Da er den bare ikke installerbar.
        console.error("[Sportsbibelen] service worker feilet:", err);
      });
    });
  }

  /* ---------- meny ---------- */

  async function loadMenu() {
    if (menuLoaded) return;

    const list = document.getElementById("menuList");

    if (MENU_OVERRIDE) {
      renderMenu(MENU_OVERRIDE);
      menuLoaded = true;
      return;
    }

    for (const source of categorySources()) {
      try {
        const cats = await fetchList(source.url);
        renderMenu(cats);
        menuLoaded = true;
        return;
      } catch (err) {
        console.error("[Sportsbibelen] meny · " + source.name + " feilet:", err);
      }
    }

    // Menyen er en bekvemmelighet. Feiler den, skal feeden fortsatt virke,
    // sa vi lar "Alle saker" sta igjen alene.
    renderMenu([]);
    const note = document.createElement("li");
    note.appendChild(el("p", "menu-state", "Klarte ikke å hente kategoriene."));
    list.appendChild(note);
  }

  function renderMenu(categories) {
    const list = document.getElementById("menuList");
    list.replaceChildren();

    list.appendChild(menuEntry({ id: null, name: "Alle saker" }));
    categories.forEach((cat) => list.appendChild(menuEntry(cat)));
  }

  function menuEntry(cat) {
    const item = document.createElement("li");
    const button = el("button", "menu-item");
    button.type = "button";
    button.dataset.catId = cat.id ? String(cat.id) : "";
    button.appendChild(el("span", null, cat.name || "Uten navn"));

    if (typeof cat.count === "number") {
      button.appendChild(el("span", "count", String(cat.count)));
    }

    if ((cat.id || null) === activeCategory) {
      button.setAttribute("aria-current", "true");
    }

    button.addEventListener("click", () => selectCategory(cat));
    item.appendChild(button);
    return item;
  }

  function selectCategory(cat) {
    const id = cat.id || null;
    activeCategory = id;

    // Marker det valgte punktet uten å hente menyen på nytt.
    const wanted = id ? String(id) : "";
    document.querySelectorAll(".menu-item").forEach((btn) => {
      if (btn.dataset.catId === wanted) btn.setAttribute("aria-current", "true");
      else btn.removeAttribute("aria-current");
    });

    // Vis i toppen hvilken del av feeden man star i.
    const tag = document.getElementById("filterTag");
    tag.textContent = id ? cat.name : "";

    track("Kategori valgt", { kategori: id ? cat.name : "alle" });
    closeMenu();
    loadFeed();
  }

  function openMenu() {
    const panel = document.getElementById("menuPanel");
    const btn = document.getElementById("menuBtn");
    panel.classList.add("open");
    btn.setAttribute("aria-expanded", "true");
    document.getElementById("menuClose").focus();
    track("Meny åpnet");
    loadMenu();
  }

  function closeMenu() {
    const panel = document.getElementById("menuPanel");
    const btn = document.getElementById("menuBtn");
    if (!panel.classList.contains("open")) return;
    panel.classList.remove("open");
    btn.setAttribute("aria-expanded", "false");
    btn.focus();
  }

  function isMenuOpen() {
    return document.getElementById("menuPanel").classList.contains("open");
  }

  document.getElementById("menuBtn").addEventListener("click", openMenu);
  document.getElementById("menuClose").addEventListener("click", closeMenu);

  /* ---------- detaljvisning ---------- */

  function openDetail(post, trigger) {
    lastFocused = trigger || document.activeElement;

    const card = document.getElementById("detailCard");
    card.replaceChildren();

    const img = getImage(post);
    if (img) card.appendChild(imageEl(img, false));

    const body = el("div", "detail-body");
    const cat = getCategory(post);
    if (cat) body.appendChild(el("span", "row-cat", cat));

    const title = el("h2", "detail-title", getTitle(post));
    title.id = "detailTitle";
    body.appendChild(title);

    const content = post.content && post.content.rendered;

    if (post.content && post.content.protected) {
      body.appendChild(el("p", "detail-excerpt",
        "Denne artikkelen er passordbeskyttet og kan ikke leses her."));
    } else if (content && content.trim()) {
      const article = el("div", "detail-content");
      article.appendChild(sanitizeHtml(content));
      body.appendChild(article);
    } else {
      // Faller tilbake til utdraget hvis feeden ikke leverer brodtekst.
      const excerpt = stripHtml(post.excerpt && post.excerpt.rendered);
      if (excerpt) body.appendChild(el("p", "detail-excerpt", excerpt));
    }

    const link = safeUrl(post.link);
    if (link) {
      const anchor = el("a", "read-link", "Les på sportsbibelen.no →");
      anchor.href = link;
      anchor.target = "_blank";
      anchor.rel = "noopener noreferrer";
      anchor.addEventListener("click", () => {
        track("Les på nettsiden", { artikkel: post.slug || String(post.id || "") });
      });
      body.appendChild(anchor);
    }

    const close = el("button", "close-btn", "Lukk");
    close.type = "button";
    close.addEventListener("click", closeDetail);
    body.appendChild(close);

    card.appendChild(body);
    card.scrollTop = 0;

    track("Artikkel åpnet", {
      artikkel: post.slug || String(post.id || ""),
      kategori: cat || "uten kategori"
    });
    document.getElementById("detailWrap").classList.add("open");
    close.focus();
  }

  function closeDetail() {
    document.getElementById("detailWrap").classList.remove("open");
    if (lastFocused && lastFocused.isConnected) lastFocused.focus();
    lastFocused = null;
  }

  function isDetailOpen() {
    return document.getElementById("detailWrap").classList.contains("open");
  }

  document.getElementById("detailWrap").addEventListener("click", (e) => {
    if (e.target.id === "detailWrap") closeDetail();
  });

  document.addEventListener("keydown", (e) => {
    if (e.key !== "Escape") return;
    if (isDetailOpen()) closeDetail();
    else if (isMenuOpen()) closeMenu();
  });

  /* ---------- oppstart ---------- */

  loadFeed();

  // Feeden oppdateres i bakgrunnen så lenge fanen er synlig. loadFeed lar
  // innholdet stå hvis leseren har scrollet ned i listen.
  setInterval(() => {
    if (!document.hidden) loadFeed({ silent: true });
  }, REFRESH_MS);
</script>
</body>
</html>
